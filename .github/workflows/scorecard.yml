name: OpenSSF Scorecard

# Continuously grades the repository's security posture (branch protection,
# token permissions, pinned dependencies, dangerous workflow patterns, etc.)
# and publishes the results to the GitHub Security tab as SARIF.

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

# No blanket workflow-level grant: the single job below declares exactly the
# scopes it needs, and a job-level `permissions:` block replaces (not merges
# with) the workflow-level one, so this empty default changes nothing at run
# time while keeping any future job that forgets its own block at zero access.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF to the code-scanning dashboard.
      security-events: write
      # Needed for GitHub OIDC so Scorecard can publish its signed result.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard

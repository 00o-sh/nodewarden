name: OpenSSF Scorecard

# Continuously grades the repository's security posture (branch protection,
# token permissions, pinned dependencies, dangerous workflow patterns, etc.)
# and publishes the results to the GitHub Security tab as SARIF.

on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

# No blanket workflow-level grant: the single job below declares exactly the
# scopes it needs, and a job-level `permissions:` block replaces (not merges
# with) the workflow-level one, so this empty default changes nothing at run
# time while keeping any future job that forgets its own block at zero access.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF to the code-scanning dashboard.
      security-events: write
      # Needed for GitHub OIDC so Scorecard can publish its signed result.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard

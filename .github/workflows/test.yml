name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Minimal default token: read-only at the top level. Only the badge-publishing
# job escalates to contents: write, and only on pushes to main.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence does not pile
# up redundant jobs (and racing badge pushes on main).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap standalone change-detection so the expensive backend shards only spin
  # up when a PR touches something that can affect the backend suite. Non-PR
  # events (push to main, manual dispatch) always run the full suite so the
  # coverage badge stays honest.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both PR endpoints present locally to diff changed files.
          fetch-depth: 0

      - name: Detect backend-relevant changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(src/|shared/|test/|vitest\.|wrangler|package\.json|package-lock\.json|\.nvmrc|tsconfig|\.github/workflows/test\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "Backend-relevant changes detected; running the full suite."
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "No backend-relevant changes; skipping the backend suite."
          fi

  # The backend suite (242 workerd/Miniflare integration tests) is embarrassingly
  # parallel, so we shard it across runners. Each shard emits a vitest "blob"
  # report (results + coverage data); the `test` job merges them and enforces the
  # ratchet once. This turns a ~7min serial coverage run into ~4 parallel ~2min
  # runs. See vitest.config.ts.
  backend-shard:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (API)
        # Vitest transpiles via esbuild (types are stripped, not checked), so the
        # strict backend type check runs separately. Only on shard 1 (identical
        # across shards); fails fast before spending time on the suite.
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Lint (API)
        # oxlint over the backend sources; --deny-warnings makes any finding fail
        # CI. Only on shard 1 (identical across shards).
        if: matrix.shard == 1
        run: npm run lint:api

      - name: Run test shard with coverage
        # Blob reporter stores this shard's results AND coverage data for the
        # merge step. Thresholds are overridden to 0 here because vitest enforces
        # the coverage ratchet at the END of every run — and a single shard only
        # exercises a slice, so it would always fail the global floor. The `test`
        # job re-applies the real thresholds (vitest.config.ts) to the MERGED
        # total. Coverage data is still collected into the blob regardless.
        run: >-
          npx vitest run --coverage
          --reporter=blob
          --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json
          --shard=${{ matrix.shard }}/4
          --coverage.thresholds.lines=0
          --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0

      - name: Upload coverage blob
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  # Aggregator + gate. KEEPS THE JOB NAME `test` so the existing branch-protection
  # required status check continues to resolve. It merges every shard's blob into
  # one report and enforces the coverage ratchet (vitest.config.ts thresholds)
  # exactly once, then publishes the backend coverage number for the badge job.
  test:
    needs: [changes, backend-shard]
    # always() so this required check still runs (and passes) on docs-only PRs
    # where the shards were skipped.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Gate on change-detection and shard results
        run: |
          if [ "${{ needs.changes.outputs.backend }}" != "true" ]; then
            echo "No backend-relevant changes; nothing to merge. ✓"
            exit 0
          fi
          if [ "${{ needs.backend-shard.result }}" != "success" ]; then
            echo "One or more backend shards failed (result=${{ needs.backend-shard.result }})."
            exit 1
          fi
          echo "All shards succeeded; proceeding to merge + ratchet."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.backend == 'true'
        with:
          # Full history so the changed-line coverage gate can diff against the
          # PR base (origin/main).
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: npm ci

      - name: Download coverage blobs
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports and enforce coverage ratchet
        # Reconstitutes the full-suite coverage from the shard blobs and enforces
        # the vitest.config.ts thresholds on the merged total, and writes
        # coverage/coverage-summary.json for the badge.
        if: needs.changes.outputs.backend == 'true'
        run: npx vitest run --merge-reports --coverage

      - name: Changed-line coverage gate (backend)
        # Fail-closed: every executable line this PR adds/changes under src/ or
        # shared/ must be covered by the merged suite above. The ratchet only
        # blocks regressions; this blocks NEW untested code. See
        # scripts/check-diff-coverage-api.cjs.
        if: needs.changes.outputs.backend == 'true'
        run: npm run coverage:diff:api

      - name: Upload backend coverage summary
        # Consumed by the `badges` job so the badge no longer requires re-running
        # the whole suite in this job.
        if: needs.changes.outputs.backend == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 1
          if-no-files-found: error

  frontend:
    # Frontend (webapp/) testing pyramid. Runs in parallel with the backend
    # shards. Every blocking step below must be green for a PR to be mergeable.
    # See docs/frontend-testing.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the changed-line coverage gate can diff against the
          # PR base (origin/main).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (frontend)
        run: npm run lint

      - name: Typecheck (frontend)
        run: npm run typecheck:webapp

      - name: Frontend tests with coverage (unit + component + contract)
        run: npm run coverage:webapp

      - name: Changed-line coverage gate (frontend)
        run: npm run coverage:diff

      - name: Upload webapp coverage summary
        # Consumed by the `badges` job (main only) so the backend `test` job no
        # longer has to re-run the whole frontend suite just to read this number.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webapp-coverage-summary
          path: coverage/webapp/coverage-summary.json
          retention-days: 1
          if-no-files-found: error

      - name: Build (production + demo)
        run: |
          npm run build
          npm run build:demo

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Key on the installed Playwright version so a dependency bump busts the
          # cache and re-provisions the matching browser build.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        # With a warm cache this only installs the OS deps (fast); the browser
        # binary is restored from cache.
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (demo build)
        run: npm run test:e2e

      - name: E2E real-backend lifecycle (real worker + D1/R2)
        run: npm run test:e2e:real

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: playwright-report/
          retention-days: 7

  # Self-contained auto-updating badges (API + web coverage + i18n). Split out of
  # the backend `test` job so that job no longer re-runs the entire frontend
  # coverage suite just to read one number, and stays read-only. Runs only on
  # pushes to main, after both coverage numbers are available.
  badges:
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # write is required only to publish the coverage badge to the `badges`
      # branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download backend coverage summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage-summary
          path: coverage

      - name: Download webapp coverage summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webapp-coverage-summary
          path: coverage/webapp

      - name: Publish badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-badges.sh

name: Sync Bitwarden global domains

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      bitwarden_ref:
        description: "bitwarden/server ref to sync"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: sync-global-domains
  cancel-in-progress: true

jobs:
  sync-global-domains:
    runs-on: ubuntu-latest
    # Needs write to push the sync branch and open the pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Sync generated Bitwarden domains
        env:
          # Pass the user-supplied input via env, never inline ${{ }} in the
          # script, so its contents can't be interpreted as shell code.
          BITWARDEN_REF: ${{ inputs.bitwarden_ref || 'main' }}
        run: |
          case "$BITWARDEN_REF" in
            "" | *[!A-Za-z0-9._/-]* )
              echo "Invalid bitwarden_ref"
              exit 1
              ;;
          esac
          npm run domains:sync -- --ref "$BITWARDEN_REF"

      - name: Verify custom domains were not touched
        run: git diff --exit-code -- src/static/global_domains.custom.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-bitwarden-global-domains
          delete-branch: true
          title: "chore: sync Bitwarden global domain rules"
          commit-message: "chore: sync Bitwarden global domain rules"
          body: |
            Automated sync from bitwarden/server.

            This PR only updates:
            - `src/static/global_domains.bitwarden.json`
            - `src/static/global_domains.bitwarden.meta.json`

            `src/static/global_domains.custom.json` is intentionally left untouched.
          add-paths: |
            src/static/global_domains.bitwarden.json
            src/static/global_domains.bitwarden.meta.json

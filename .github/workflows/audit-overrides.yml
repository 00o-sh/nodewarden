name: Audit overrides

# Keeps the package.json `overrides` block from going stale. An override is a
# MANUAL pin — Renovate stops nagging once its bump PR is closed as "blocked" —
# so a pin can silently fall BELOW what packages in the tree now require. Because
# overrides always win, npm forces the stale version instead of erroring, and
# nothing surfaces it in a normal install (see issue #234: the `undici` pin sat
# at 7.x for months after jsdom moved to `undici@^8`).
#
# This runs scripts/check-stale-overrides.cjs nightly against the committed
# lockfile (fully static — no network). When it finds a "held back" override it
# opens (or updates) a single tracking issue; when the tree is healthy again it
# closes that issue. It never fails a build — the tracking issue is the signal.

on:
  schedule:
    - cron: '17 4 * * *' # nightly, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-overrides
  cancel-in-progress: true

env:
  ISSUE_LABEL: stale-override
  ISSUE_TITLE: 'Stale override(s) detected — dependency pin has fallen behind'

jobs:
  audit:
    runs-on: ubuntu-latest
    # issues: write so the tracking issue can be opened/updated/closed.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Run override audit
        id: audit
        run: |
          # The script exits 2 when a held-back override is found, 0 when clean.
          # `set +e` so a non-zero exit is captured instead of failing the job.
          set +e
          node scripts/check-stale-overrides.cjs --markdown > /tmp/override-body.md
          code=$?
          set -e
          echo "found=$([ "$code" = "2" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "Audit script errored (exit $code)"
            exit "$code"
          fi
          # Also print the human-readable report to the job log for at-a-glance runs.
          node scripts/check-stale-overrides.cjs || true

      - name: Open or update tracking issue
        if: steps.audit.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$ISSUE_LABEL" --color D93F0B \
            --description "An overrides pin has fallen behind the tree" --force

          EXISTING=$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file /tmp/override-body.md
          else
            echo "Creating new tracking issue"
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" \
              --body-file /tmp/override-body.md
          fi

      - name: Close tracking issue when healthy
        if: steps.audit.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Overrides healthy again — closing #$EXISTING"
            gh issue close "$EXISTING" \
              --comment "All overrides now satisfy the ranges declared in the tree. Closing automatically."
          else
            echo "Overrides healthy; no open tracking issue."
          fi
